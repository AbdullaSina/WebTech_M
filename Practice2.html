<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Admission Form</title>
</head>

<body>

    <h1>University Online Admission Form</h1>

    <!-- Form Container -->
    <form action="/submit" method="POST">

        <!-- ================= Personal Information ================= -->
        <fieldset>
            <legend><b>Personal Information</b></legend>

            <label>Full Name:</label><br>
            <input type="text" name="fullname" maxlength="50" required>
            <br><br>

            <label>Email Address:</label><br>
            <input type="email" name="email" required>
            <br><br>

            <label>Date of Birth:</label><br>
            <input type="date" name="dob" required>
            <br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
            <br><br>

            <label>Phone Number:</label><br>
            <input type="text" name="phone" maxlength="11" required>
            <br><br>

        </fieldset>

        <br>

        <!-- ================= Academic Information ================= -->
        <fieldset>
            <legend><b>Academic Information</b></legend>

            <label>Previous Institution Name:</label><br>
            <input type="text" name="institution" maxlength="100" required>
            <br><br>

            <label>GPA / Result:</label><br>
            <input type="text" name="gpa" maxlength="5" required>
            <br><br>

            <label>Preferred Department:</label><br>
            <select name="department" required>
                <option value="">-- Select Department --</option>
                <option value="CSE">Computer Science & Engineering</option>
                <option value="EEE">Electrical & Electronic Engineering</option>
                <option value="BBA">Business Administration</option>
                <option value="English">English</option>
            </select>
            <br><br>

            <label>Areas of Interest:</label><br>
            <input type="checkbox" name="interest" value="Research"> Research
            <input type="checkbox" name="interest" value="Sports"> Sports
            <input type="checkbox" name="interest" value="Programming"> Programming
            <input type="checkbox" name="interest" value="Cultural"> Cultural Activities
            <br><br>

        </fieldset>

        <br>

        <!-- ================= Document Upload ================= -->
        <fieldset>
            <legend><b>Upload Documents</b></legend>

            <label>Upload Transcript:</label><br>
            <input type="file" name="transcript" required>
            <br><br>

            <label>Upload Resume:</label><br>
            <input type="file" name="resume">
            <br><br>

        </fieldset>

        <br>

        <!-- ================= Buttons ================= -->
        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
